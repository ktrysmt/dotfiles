# Global mise configuration
# Symlink to: ~/.config/mise/config.toml
# Apply with: mise install

[tools]
go = "1.25"
bun = "latest"
node = "latest"

# Language tools
ruff = "latest"
uv = "latest"

# Editor
neovim = "0.12"

# CLI tools (version switchable)
ripgrep = "latest"
fzf = "latest"
fd  = "10.3"
bat = "latest"
ghq = "latest"
delta = "latest"
jq = "latest"
glow = "latest"
xh = "latest"
buf = "latest"
pinact = "latest"
peco = "latest"
terraform = "latest"


# CLI tools (aqua/github backend)
"aqua:Wilfred/difftastic" = "latest"
"aqua:ynqa/jnv" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:rossmacarthur/sheldon" = "latest"
"github:dalance/procs" = "latest"
"github:sudorandom/fauxrpc" = "latest" # grpc mock

# npm tools
"npm:diff-so-fancy" = "latest"
"npm:pnpm" = "latest"
"npm:memd-cli" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@anthropic-ai/sandbox-runtime" = "latest"
"npm:agent-browser" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["terraform"]
# Resolve "latest" from the local cache instead of querying GitHub on every shim
# call. The unauthenticated queries hit the per-IP rate limit. Update with mise upgrade.
prefer_offline = true
